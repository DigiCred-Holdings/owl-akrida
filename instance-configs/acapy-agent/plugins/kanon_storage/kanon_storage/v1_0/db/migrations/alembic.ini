[alembic]
script_location = .
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///:memory:
version_table = kanon_storage_alembic
version_table_schema =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
