[tool.poetry]
name = "kanon-storage"
version = "0.1.0"
description = "Clean-room ACA-Py storage backend — SQLAlchemy 2.0 + Alembic + per-record adapters. Registers wallet.type=kanon-storage-anoncreds. Zero imports from acapy_agent.askar or acapy_agent.kanon."
authors = ["DigiCred"]
license = "Apache-2.0"
packages = [{include = "kanon_storage"}]

[tool.poetry.dependencies]
python = "^3.13"
acapy-agent = { version = ">=1.5.0" }
# Storage stack — replaces askar Store and kanon DBStore.
"sqlalchemy" = { version = "^2.0", extras = ["asyncio"] }
alembic = "^1.13"
asyncpg = "^0.30"
aiosqlite = "^0.20"
# Crypto primitives — function-level only, NO aries_askar.Store usage.
"aries-askar" = "*"
# AnonCreds primitives — phase 3.
"indy-credx" = "*"
# DIDComm v2 — we plug our SecretsManager into the same DMP library acapy uses.
"didcomm-messaging" = "*"
# Master-key encryption for our own keystore.
cryptography = "^44.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.5"
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools", "poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
