label: IssuerIsolatedKanon
wallet-name: issuer-isolated-kanon
inbound-transport:
  - [http, 0.0.0.0, 8151]
admin: [0.0.0.0, 8150]

# Stripped for ACA-Py isolation: no Redis plugin, no ledger
no-ledger: true

outbound-transport: http
emit-new-didcomm-prefix: true

auto-accept-invites: true
auto-accept-requests: true
auto-ping-connection: false
public-invites: true

preserve-exchange-records: false

# Kanon storage backend (SQLAlchemy 2.0 + asyncpg), stock send pipeline —
# no didcomm_fastpath. Baseline for "does Kanon move the stock ceiling?".
# DB URL + 32-byte master key are supplied via KANON_STORAGE_* env vars.
wallet-type: kanon-storage-anoncreds
wallet-key: "insecure, for use in demo only"
auto-provision: true

plugin:
  - kanon_storage.v1_0
